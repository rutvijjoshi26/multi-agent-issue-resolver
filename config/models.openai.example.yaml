# A ready-to-run OpenAI configuration with cost-sensitive tiers: small
# models where the call count is high (screening, the parallel
# investigators) and a stronger model only for the single synthesis call.
#
#   cp config/models.openai.example.yaml config/models.yaml
#   export OPENAI_API_KEY=...        # or put it in .env
#
# Prices are US dollars per million tokens and are used only to estimate,
# report and cap spend. Check them against current OpenAI pricing before
# relying on the dollar figures; the token counts are recorded regardless.
tiers:
  embed:
    provider: openai-compatible
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
    input_cost_per_mtok: 0.02
    output_cost_per_mtok: 0
  screen:
    provider: openai-compatible
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60
  investigate:
    provider: openai-compatible
    base_url: https://api.openai.com/v1
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    input_cost_per_mtok: 0.40
    output_cost_per_mtok: 1.60
  synthesize:
    provider: openai-compatible
    base_url: https://api.openai.com/v1
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    input_cost_per_mtok: 2.00
    output_cost_per_mtok: 8.00
