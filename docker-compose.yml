services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: miresolver
      POSTGRES_PASSWORD: miresolver
      POSTGRES_DB: miresolver
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
volumes:
  pgdata:
  qdrantdata:
