[project]
name = "miresolver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "langgraph>=1.0", "psycopg[binary]>=3.2", "pyyaml>=6.0", "qdrant-client>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
miresolver = "miresolver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miresolver"]

[tool.hatch.build.targets.wheel.force-include]
"src/miresolver/schema.sql" = "miresolver/schema.sql"

[tool.pytest.ini_options]
pythonpath = ["src"]
